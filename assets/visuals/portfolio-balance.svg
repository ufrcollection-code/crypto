<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Portfolio diversification diagram</title><desc id="d">Different holdings connect to common risk drivers, illustrating that ticker count is not the same as diversification.</desc><rect width="960" height="540" fill="#f6f3ed"/><g stroke="#62665e" stroke-width="4"><path d="M480 270 170 140M480 270 170 400M480 270 790 140M480 270 790 400"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="480" cy="270" r="95" fill="#1d211e"/><text x="480" y="260" fill="#fff" font-size="21" font-weight="700">COMMON</text><text x="480" y="292" fill="#d0a55e" font-size="19">DRIVERS</text><g fill="#bd6844"><circle cx="170" cy="140" r="62"/><circle cx="790" cy="400" r="62"/></g><g fill="#79856a"><circle cx="170" cy="400" r="62"/><circle cx="790" cy="140" r="62"/></g><g fill="#fff" font-size="17" font-weight="700"><text x="170" y="146">ASSET A</text><text x="170" y="406">ASSET B</text><text x="790" y="146">ASSET C</text><text x="790" y="406">ASSET D</text></g><text x="480" y="490" fill="#62665e" font-size="19" font-weight="700">COUNT HOLDINGS · THEN CHECK WHAT ACTUALLY MOVES THEM</text></g></svg>
