<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Company earnings to earnings per share diagram</title><desc id="d">Revenue flows through costs into profit and is divided across shares to calculate earnings per share.</desc><rect width="960" height="540" fill="#f6f3ed"/><g font-family="Arial,sans-serif"><rect x="70" y="190" width="190" height="140" rx="20" fill="#1d211e"/><text x="165" y="250" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">REVENUE</text><text x="165" y="282" text-anchor="middle" fill="#d0a55e" font-size="17">CUSTOMER SALES</text><path d="M260 260H370" stroke="#bd6844" stroke-width="7"/><path d="m350 242 24 18-24 18" fill="none" stroke="#bd6844" stroke-width="7"/><rect x="380" y="190" width="200" height="140" rx="20" fill="#79856a"/><text x="480" y="245" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PROFIT</text><text x="480" y="279" text-anchor="middle" fill="#fff" font-size="16">AFTER COSTS</text><path d="M580 260H690" stroke="#bd6844" stroke-width="7"/><path d="m670 242 24 18-24 18" fill="none" stroke="#bd6844" stroke-width="7"/><rect x="700" y="150" width="190" height="220" rx="20" fill="#ebe6dc" stroke="#d9d3c7"/><text x="795" y="224" text-anchor="middle" fill="#1d211e" font-size="22" font-weight="700">EPS</text><text x="795" y="260" text-anchor="middle" fill="#a45536" font-size="16">PROFIT ÷ SHARES</text><g fill="#bd6844"><circle cx="755" cy="310" r="12"/><circle cx="795" cy="310" r="12"/><circle cx="835" cy="310" r="12"/></g></g></svg>
