<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Two tickers can leave 46% in one company</title><desc>Company A exposure combines 400 dollars of direct shares and 60 dollars inside a fund, for 46 percent of the portfolio.</desc><rect width="960" height="540" rx="20" fill="#f3eee4"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="15" fill="#715747">CRYPTOSTOCKS / ILLUSTRATIVE WORKSHEET</text><text x="44" y="96" font-size="29" fill="#26322d">Two tickers can leave 46% in one company</text><text x="44" y="160" fill="#26322d" font-size="22">Direct Company A</text><rect x="44" y="176" width="481.48148148148147" height="22" rx="4" fill="#ac684b"/><text x="735" y="194" fill="#26322d" font-size="24">$400</text><text x="44" y="255" fill="#26322d" font-size="22">Company A inside ETF</text><rect x="44" y="271" width="72.22222222222223" height="22" rx="4" fill="#ac684b"/><text x="735" y="289" fill="#26322d" font-size="24">$60</text><text x="44" y="350" fill="#26322d" font-size="22">Other ETF holdings</text><rect x="44" y="366" width="650.0" height="22" rx="4" fill="#ac684b"/><text x="735" y="384" fill="#26322d" font-size="24">$540</text><text x="44" y="495" font-size="18" fill="#715747">Illustrative $1,000 portfolio</text></g></svg>