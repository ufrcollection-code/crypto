<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Four units: weighted average fill is $101</title><desc>Three fills cost 100, 202 and 102 dollars; four units cost 404 dollars in total.</desc><rect width="960" height="540" rx="20" fill="#f3eee4"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="15" fill="#715747">CRYPTOSTOCKS / ILLUSTRATIVE WORKSHEET</text><text x="44" y="96" font-size="29" fill="#26322d">Four units: weighted average fill is $101</text><text x="44" y="160" fill="#26322d" font-size="22">1 unit at $100</text><rect x="44" y="176" width="321.7821782178218" height="22" rx="4" fill="#ac684b"/><text x="735" y="194" fill="#26322d" font-size="24">$100</text><text x="44" y="255" fill="#26322d" font-size="22">2 units at $101</text><rect x="44" y="271" width="650.0" height="22" rx="4" fill="#ac684b"/><text x="735" y="289" fill="#26322d" font-size="24">$202</text><text x="44" y="350" fill="#26322d" font-size="22">1 unit at $102</text><rect x="44" y="366" width="328.2178217821782" height="22" rx="4" fill="#ac684b"/><text x="735" y="384" fill="#26322d" font-size="24">$102</text><text x="44" y="495" font-size="18" fill="#715747">Purchase value by fill; total $404</text></g></svg>