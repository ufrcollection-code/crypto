<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Market research evidence map</title><desc id="d">A four-step process from question to primary source, assumptions and review trigger.</desc><rect width="960" height="540" fill="#ebe6dc"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#1d211e" font-size="26" font-weight="700">FROM STORY TO REVIEWABLE THESIS</text><g font-size="18" font-weight="700"><rect x="60" y="190" width="180" height="140" rx="20" fill="#1d211e"/><text x="150" y="250" text-anchor="middle" fill="#fff">QUESTION</text><text x="150" y="280" text-anchor="middle" fill="#d0a55e">01</text><rect x="280" y="190" width="180" height="140" rx="20" fill="#bd6844"/><text x="370" y="250" text-anchor="middle" fill="#fff">PRIMARY</text><text x="370" y="280" text-anchor="middle" fill="#fff">SOURCE · 02</text><rect x="500" y="190" width="180" height="140" rx="20" fill="#79856a"/><text x="590" y="250" text-anchor="middle" fill="#fff">ASSUMPTIONS</text><text x="590" y="280" text-anchor="middle" fill="#fff">03</text><rect x="720" y="190" width="180" height="140" rx="20" fill="#1d211e"/><text x="810" y="250" text-anchor="middle" fill="#fff">REVIEW</text><text x="810" y="280" text-anchor="middle" fill="#d0a55e">TRIGGER · 04</text></g><path d="M240 260H280M460 260H500M680 260H720" stroke="#a45536" stroke-width="7"/></g></svg>
