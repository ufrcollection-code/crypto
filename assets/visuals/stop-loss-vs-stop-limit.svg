<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>A planned stop is not a guaranteed fill</title><desc>A hypothetical entry at 50 dollars, planned stop at 47 and gap fill at 45.</desc><rect width="960" height="540" rx="20" fill="#f3eee4"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="15" fill="#715747">CRYPTOSTOCKS / ILLUSTRATIVE WORKSHEET</text><text x="44" y="96" font-size="29" fill="#26322d">A planned stop is not a guaranteed fill</text><text x="44" y="160" fill="#26322d" font-size="22">Entry price</text><rect x="44" y="176" width="650.0" height="22" rx="4" fill="#ac684b"/><text x="735" y="194" fill="#26322d" font-size="24">$50</text><text x="44" y="255" fill="#26322d" font-size="22">Planned stop</text><rect x="44" y="271" width="611.0" height="22" rx="4" fill="#ac684b"/><text x="735" y="289" fill="#26322d" font-size="24">$47</text><text x="44" y="350" fill="#26322d" font-size="22">Gap fill example</text><rect x="44" y="366" width="585.0" height="22" rx="4" fill="#ac684b"/><text x="735" y="384" fill="#26322d" font-size="24">$45</text><text x="44" y="495" font-size="18" fill="#715747">USD per share; hypothetical prices</text></g></svg>