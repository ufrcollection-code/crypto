<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Forex margin and leverage diagram</title><desc id="d">A small collateral block supports a larger notional exposure while market movement acts on the full exposure.</desc><rect width="960" height="540" fill="#ebe6dc"/><g font-family="Arial,sans-serif"><text x="70" y="74" fill="#1d211e" font-size="25" font-weight="700">MARGIN SUPPORTS EXPOSURE — IT DOES NOT CAP LOSS</text><rect x="90" y="330" width="220" height="120" rx="18" fill="#bd6844"/><text x="200" y="385" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">MARGIN</text><text x="200" y="416" text-anchor="middle" fill="#fff" font-size="18">1,000</text><path d="M310 390H420" stroke="#1d211e" stroke-width="5"/><path d="m405 374 20 16-20 16" fill="none" stroke="#1d211e" stroke-width="5"/><rect x="430" y="130" width="420" height="320" rx="22" fill="#1d211e"/><text x="640" y="245" text-anchor="middle" fill="#d0a55e" font-size="56" font-weight="700">30,000</text><text x="640" y="284" text-anchor="middle" fill="#fffdf9" font-size="21">NOTIONAL EXPOSURE</text><path d="M500 350H780" stroke="#79856a" stroke-width="18"/><circle cx="610" cy="350" r="15" fill="#d0a55e"/><text x="640" y="405" text-anchor="middle" fill="#c8b79d" font-size="18">PRICE MOVEMENT APPLIES HERE</text></g></svg>
