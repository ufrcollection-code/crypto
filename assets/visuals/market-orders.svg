<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Market and limit order trade-offs</title><desc id="d">A comparison of market orders prioritising execution and limit orders prioritising price control.</desc><rect width="960" height="540" fill="#ebe6dc"/><g font-family="Arial,sans-serif"><text x="70" y="75" fill="#1d211e" font-size="26" font-weight="700">EACH ORDER CHOOSES A TRADE-OFF</text><rect x="70" y="140" width="390" height="310" rx="24" fill="#1d211e"/><text x="110" y="205" fill="#d0a55e" font-size="20" font-weight="700">MARKET ORDER</text><text x="110" y="260" fill="#fff" font-size="34" font-weight="700">Execution first</text><text x="110" y="310" fill="#c8b79d" font-size="18">Available price may vary</text><path d="M110 370H400" stroke="#bd6844" stroke-width="12"/><path d="m370 345 32 25-32 25" fill="none" stroke="#bd6844" stroke-width="12"/><rect x="500" y="140" width="390" height="310" rx="24" fill="#79856a"/><text x="540" y="205" fill="#fff" font-size="20" font-weight="700">LIMIT ORDER</text><text x="540" y="260" fill="#fff" font-size="34" font-weight="700">Price first</text><text x="540" y="310" fill="#fff" font-size="18">The order may not fill</text><path d="M540 370H830" stroke="#d0a55e" stroke-width="4" stroke-dasharray="12 12"/></g></svg>
